server:
  port: 8080

spring:
  application:
    name: railscale-core

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/railscale_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

railscale:
  reservation:
    hold-timeout: 5m
    payment-timeout: 2m
  reconciliation:
    interval-ms: 5000
  redis:
    lock-ttl: 5000
    seat-cache-ttl: 30
    rate-limit:
      max-requests: 100
      window-seconds: 60

logging:
  level:
    com.railscale: DEBUG
    org.hibernate.SQL: INFO
