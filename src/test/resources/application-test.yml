spring:
  datasource:
    url: jdbc:h2:mem:railscale_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

railscale:
  reservation:
    hold-timeout: 5m
    payment-timeout: 2m
  reconciliation:
    interval-ms: 5000

logging:
  level:
    com.railscale: DEBUG
