server:
  port: 8085

spring:
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/railscale}
    username: ${SPRING_DATASOURCE_USERNAME:railscale}
    password: ${SPRING_DATASOURCE_PASSWORD:railscale}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: railscale-notification-service
      auto-offset-reset: earliest

logging:
  level:
    com.railscale: INFO
