server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/railscale}
    username: ${SPRING_DATASOURCE_USERNAME:railscale}
    password: ${SPRING_DATASOURCE_PASSWORD:railscale}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.railscale: INFO
