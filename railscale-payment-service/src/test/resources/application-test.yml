server:
  port: 8084

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

railscale:
  payment:
    failure-rate: 0.0

logging:
  level:
    com.railscale: DEBUG
