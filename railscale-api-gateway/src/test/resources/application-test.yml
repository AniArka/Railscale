server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: search-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/search/**
        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/bookings/**

logging:
  level:
    com.railscale: DEBUG
