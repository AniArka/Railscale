server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/users
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, SERVICE_UNAVAILABLE
                methods: GET
        - id: search-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/search/**
          filters:
            - name: CircuitBreaker
              args:
                name: searchServiceCircuitBreaker
                fallbackUri: forward:/fallback/search
        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/bookings/**
          filters:
            - name: CircuitBreaker
              args:
                name: bookingServiceCircuitBreaker
                fallbackUri: forward:/fallback/bookings

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 5
        minimumNumberOfCalls: 2
        waitDurationInOpenState: 1s
        failureRateThreshold: 50
    instances:
      userServiceCircuitBreaker:
        baseConfig: default
      searchServiceCircuitBreaker:
        baseConfig: default
      bookingServiceCircuitBreaker:
        baseConfig: default

logging:
  level:
    com.railscale: DEBUG
